<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mar y las siete llaves de las palabras</title><style>
*{box-sizing:border-box}body{margin:0;color:#30274c;background:#f6f0ff;font-family:'Comic Sans MS','Trebuchet MS',sans-serif;font-size:19px}main{max-width:850px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(27px,5vw,42px);line-height:1.15}h2{font-size:27px}button{font:inherit;cursor:pointer;border:2px solid #ddd1ef;border-radius:18px;padding:16px;background:white;color:#352650;min-height:56px;touch-action:manipulation}button:hover{border-color:#8b5bd6}button:focus-visible{outline:4px solid #f8b935}button:disabled{cursor:default}small{font-size:15px}.hero{background:linear-gradient(120deg,#523386,#8152b5);color:white;padding:25px;border-radius:26px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.tile{text-align:left;box-shadow:0 5px 0 #e2d7ef}.icon{font-size:42px}.card{background:white;border-radius:25px;padding:25px;margin-top:20px;box-shadow:0 8px 0 #e2d7ef}.question{white-space:pre-line;font-size:25px;line-height:1.5}.options{display:grid;gap:12px}.options button{text-align:left}.good{background:#def5df;border-color:#418d52}.bad{background:#fff0db;border-color:#d79034}.feedback{min-height:70px;line-height:1.5;margin-top:18px}.bar{height:12px;background:#ddd1ec;border-radius:20px;overflow:hidden;margin:18px 0}.bar div{height:100%;background:#8a60c8}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.primary{background:#6942a5;color:white;border-color:#6942a5}details{font-size:17px;margin:16px 0}summary{cursor:pointer}footer{text-align:center;font-size:14px;margin:30px 0;color:#6c607f}@media(max-width:450px){main{padding:14px}.card{padding:18px}.question{font-size:22px}}@media(prefers-reduced-motion:no-preference){.card{animation:enter .25s}@keyframes enter{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}}</style><main><header><b>🗝️ La aventura de Mar</b><button onclick="home()" aria-label="Volver al mapa">🗺️ Mapa</button></header><section id="app"></section><footer>Lengua · 2.º de Primaria · Sin prisas, sin perder vidas</footer></main><script>
const levels=[{"title": "El puente de la cortesía", "icon": "🌈", "tip": "Las palabras amables nos ayudan a convivir.", "qs": [{"q": "Una amiga te presta su lápiz. ¿Qué dices?", "options": ["Muchas gracias", "Hasta mañana", "Perdón"], "answer": 0, "why": "Damos las gracias cuando alguien nos ayuda."}, {"q": "Quieres que te pasen un libro. Completa: «¿Me lo pasas, …?»", "options": ["por favor", "perdón", "adiós"], "answer": 0, "why": "Por favor sirve para pedir algo con cortesía."}, {"q": "Has pisado a alguien sin querer. ¿Qué dices?", "options": ["Perdón", "De nada", "Buenas noches"], "answer": 0, "why": "Pedimos disculpas si hacemos daño sin querer."}, {"q": "Entras en clase por la mañana. ¿Cómo saludas?", "options": ["Buenas noches", "Buenos días", "Hasta luego"], "answer": 1, "why": "Buenos días es un saludo de la mañana."}, {"q": "Te dan las gracias. ¿Qué puedes responder?", "options": ["De nada", "Dámelo", "Perdón"], "answer": 0, "why": "De nada es una respuesta amable a un agradecimiento."}]}, {"title": "El bosque de los contrarios", "icon": "🌳", "tip": "Los antónimos tienen significados contrarios. A veces usamos des- o in-.", "qs": [{"q": "¿Cuál es el antónimo de «alto»?", "options": ["grande", "bajo", "largo"], "answer": 1, "why": "«alto» y «bajo» tienen significados contrarios."}, {"q": "¿Cuál es el antónimo de «limpio»?", "options": ["sucio", "claro", "nuevo"], "answer": 0, "why": "«limpio» y «sucio» tienen significados contrarios."}, {"q": "¿Cuál es el antónimo de «lejos»?", "options": ["dentro", "cerca", "arriba"], "answer": 1, "why": "«lejos» y «cerca» tienen significados contrarios."}, {"q": "¿Cuál es el antónimo de «fácil»?", "options": ["rápido", "difícil", "suave"], "answer": 1, "why": "«fácil» y «difícil» tienen significados contrarios."}, {"q": "¿Cuál es el antónimo de «encendido»?", "options": ["apagado", "luminoso", "rojo"], "answer": 0, "why": "«encendido» y «apagado» tienen significados contrarios."}, {"q": "¿Cuál es el antónimo de «ordenado»?", "options": ["ordenador", "desordenado", "ordenar"], "answer": 1, "why": "«ordenado» y «desordenado» tienen significados contrarios."}, {"q": "¿Cuál es el antónimo de «cómodo»?", "options": ["incómodo", "acomodado", "cómoda"], "answer": 0, "why": "«cómodo» y «incómodo» tienen significados contrarios."}, {"q": "¿Cuál es el antónimo de «hacer»?", "options": ["rehacer", "deshacer", "hecho"], "answer": 1, "why": "«hacer» y «deshacer» tienen significados contrarios."}, {"q": "¿Cuál es el antónimo de «tranquilo»?", "options": ["intranquilo", "tranquila", "destranquilo"], "answer": 0, "why": "«tranquilo» y «intranquilo» tienen significados contrarios."}, {"q": "¿Cuál es el antónimo de «inflado»?", "options": ["inflable", "desinflado", "grande"], "answer": 1, "why": "«inflado» y «desinflado» tienen significados contrarios."}]}, {"title": "La torre de los signos", "icon": "✨", "tip": "¿…? para preguntar. ¡…! para expresar emociones. Usamos un signo al principio y otro al final.", "qs": [{"q": "Quieres saber dónde está tu amiga. Elige.", "options": ["¡Dónde estás!", "¿Dónde estás?", "Dónde estás?"], "answer": 1, "why": "Es una pregunta y necesita los dos signos de interrogación."}, {"q": "Te llevas una sorpresa. Elige.", "options": ["¡Qué sorpresa!", "¿Qué sorpresa?", "Qué sorpresa!"], "answer": 0, "why": "La sorpresa se expresa con exclamaciones al principio y al final."}, {"q": "¿Qué oración está bien escrita?", "options": ["¿Te gusta nadar?", "Te gusta nadar?", "¿Te gusta nadar!"], "answer": 0, "why": "Los signos de interrogación forman la pareja ¿ y ?."}, {"q": "Te has caído y expresas dolor. Elige.", "options": ["¿Qué daño?", "¡Qué daño!", "Qué daño?"], "answer": 1, "why": "Aquí expresas dolor con ¡ y !."}, {"q": "¿Cuál sirve para preguntar?", "options": ["¡Me encanta!", "¿Cuál es tu juego favorito?", "El patio es grande."], "answer": 1, "why": "Esta oración pide información."}, {"q": "¿Qué pareja de signos completa «…Qué frío…» si expresas lo que sientes?", "options": ["¿ ?", "¡ !", ". ."], "answer": 1, "why": "Para expresar frío con emoción usamos ¡Qué frío!"}]}, {"title": "El castillo de los nombres", "icon": "🏰", "tip": "Los comunes nombran seres, lugares o cosas. Los propios los distinguen y llevan mayúscula inicial.", "qs": [{"q": "En «Mar lee un libro», ¿qué clase de nombre es «Mar»?", "options": ["Común", "Propio"], "answer": 1, "why": "Mar es el nombre de una persona."}, {"q": "En «Mar lee un libro», ¿qué clase de nombre es «libro»?", "options": ["Común", "Propio"], "answer": 0, "why": "Libro nombra un tipo de objeto."}, {"q": "En «El gato se llama Nube», ¿qué clase de nombre es «Nube»?", "options": ["Común", "Propio"], "answer": 1, "why": "Aquí Nube es el nombre propio del gato."}, {"q": "En «Vivo en Avilés», ¿qué clase de nombre es «Avilés»?", "options": ["Común", "Propio"], "answer": 1, "why": "Avilés es el nombre propio de una ciudad."}, {"q": "En «El pez nada», ¿qué clase de nombre es «pez»?", "options": ["Común", "Propio"], "answer": 0, "why": "Pez es un nombre común de animal."}, {"q": "En «Marta visita Francia», ¿qué clase de nombre es «Francia»?", "options": ["Común", "Propio"], "answer": 1, "why": "Francia es un nombre propio de país."}, {"q": "¿Qué nombre propio está bien escrito?", "options": ["sevilla", "Sevilla", "SEvilla"], "answer": 1, "why": "Los nombres propios llevan mayúscula inicial."}]}, {"title": "La isla de los conjuntos", "icon": "🏝️", "tip": "Un nombre colectivo, aunque esté en singular, nombra un conjunto: equipo, rebaño, bosque…", "qs": [{"q": "¿Qué palabra nombra un conjunto de ovejas?", "options": ["oveja", "rebaño", "ramo"], "answer": 1, "why": "Un rebaño es un conjunto de ovejas."}, {"q": "¿Qué palabra nombra un conjunto de árboles?", "options": ["bosque", "árbol", "flor"], "answer": 0, "why": "Bosque es un nombre colectivo."}, {"q": "¿Qué palabra nombra un conjunto de cartas de jugar?", "options": ["carta", "biblioteca", "baraja"], "answer": 2, "why": "Una baraja reúne cartas de jugar."}, {"q": "¿Qué palabra nombra un conjunto de músicos?", "options": ["orquesta", "músico", "equipo"], "answer": 0, "why": "Una orquesta es un conjunto de músicos."}, {"q": "¿Qué palabra nombra un conjunto de flores cortadas?", "options": ["rebaño", "ramo", "flor"], "answer": 1, "why": "Un ramo es un conjunto de flores."}, {"q": "¿Qué palabra nombra un conjunto de jugadores?", "options": ["jugador", "equipo", "baraja"], "answer": 1, "why": "Un equipo reúne jugadores."}, {"q": "«Árboles» está en plural. ¿Es un nombre colectivo?", "options": ["Sí, porque son varios", "No: es un nombre individual en plural"], "answer": 1, "why": "Árbol sigue siendo individual en plural. El colectivo es bosque."}, {"q": "Elige el nombre individual.", "options": ["rebaño", "oveja", "equipo"], "answer": 1, "why": "Oveja nombra un animal; rebaño nombra un conjunto."}]}, {"title": "El patio de los enigmas", "icon": "🎲", "tip": "Lee las reglas antes de responder. Puedes volver a leerlas en cada reto.", "qs": [{"q": "REGLA: En la rayuela, la casilla con la piedra no se pisa.\nLa piedra está en el 3. ¿Qué haces?", "options": ["Piso el 3", "Salto esa casilla", "La empujo con el pie"], "answer": 1, "why": "Hay que saltar la casilla que contiene la piedra."}, {"q": "REGLA: Si pierdes el equilibrio, pierdes el turno.\n¿Qué ocurre si te caes?", "options": ["Juegas otra vez inmediatamente", "Pierdes el turno", "Ganas un punto"], "answer": 1, "why": "Las reglas dicen que se pierde el turno."}, {"q": "REGLA: En el pañuelo hay dos equipos con igual número de participantes.\nUno tiene 5 personas. ¿Cuántas debe tener el otro?", "options": ["4", "5", "6"], "answer": 1, "why": "Los dos equipos deben tener el mismo número."}, {"q": "REGLA: La persona que arbitra sujeta el pañuelo y dice un número.\n¿Quién anuncia el número?", "options": ["La persona que arbitra", "Todo el equipo a la vez", "Quien gana"], "answer": 0, "why": "La persona que arbitra dirige el juego."}, {"q": "Una amiga no puede saltar a la pata coja. ¿Cómo adaptamos la rayuela?", "options": ["No puede jugar", "Acordamos recorrerla caminando", "Le quitamos el turno"], "answer": 1, "why": "Podemos adaptar las reglas para que todas las personas participen."}, {"q": "¿Para qué sirven las reglas de un juego?", "options": ["Para saber cómo jugar", "Para contar un cuento", "Para describir una casa"], "answer": 0, "why": "Las reglas explican cómo jugar y qué debemos cumplir."}]}, {"title": "El jardín sin barreras", "icon": "🌻", "tip": "Una descripción cuenta cómo es un lugar y dónde están sus elementos.", "qs": [{"q": "LEE: El patio tiene un árbol a la izquierda y una fuente junto a la entrada.\n¿Dónde está la fuente?", "options": ["Junto a la entrada", "Detrás del árbol", "A la derecha del árbol"], "answer": 0, "why": "El texto dice que está junto a la entrada."}, {"q": "LEE: La biblioteca es pequeña, luminosa y tranquila.\n¿Qué hace este texto?", "options": ["Explica las reglas de un juego", "Describe un lugar", "Hace una pregunta"], "answer": 1, "why": "Cuenta cómo es la biblioteca."}, {"q": "Hay escalones para entrar al jardín. ¿Qué facilitaría el acceso?", "options": ["Una rampa adecuada", "Más escalones", "Una verja cerrada"], "answer": 0, "why": "Una rampa adecuada facilita el acceso a personas con movilidad reducida."}, {"q": "El aviso de fin del recreo solo suena por altavoces. ¿Qué ayuda a quien no oye bien?", "options": ["Añadir una señal luminosa", "Subir todas las papeleras", "Quitar los avisos"], "answer": 0, "why": "La señal luminosa ofrece la información de forma visual."}, {"q": "¿Qué frase describe mejor un patio?", "options": ["Es grande, tiene árboles y un banco junto al muro.", "¡Corre!", "¿Vienes?"], "answer": 0, "why": "Describe su tamaño, sus elementos y dónde están."}, {"q": "Las papeleras están demasiado altas. ¿Qué mejora el patio?", "options": ["Ponerlas a una altura accesible", "Subirlas aún más", "Esconderlas"], "answer": 0, "why": "Así más personas pueden utilizarlas."}]}];let progress={};try{progress=JSON.parse(localStorage.getItem('marLenguaLlaves')||'{}')}catch(e){}let li=0,queue=[],pos=0,miss=[],first=0,answered=false;const app=document.getElementById('app');function save(){try{localStorage.setItem('marLenguaLlaves',JSON.stringify(progress))}catch(e){}}function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}function home(){if(window.speechSynthesis)speechSynthesis.cancel();app.innerHTML='<div class="hero"><div class="icon">🧙‍♀️ 🐈 ✨</div><h1>Mar y las siete llaves<br>de las palabras</h1><p>Una gata mágica ha escondido siete llaves. Supera los retos para abrir su biblioteca secreta.</p><p>🗝️ '+Object.keys(progress).length+' de 7 llaves encontradas</p></div><div class="grid">'+levels.map((l,i)=>'<button class="tile" onclick="start('+i+')"><span class="icon">'+l.icon+'</span><h2>'+l.title+'</h2><small>'+(progress[i]?'🗝️ Llave conseguida · Volver a jugar':l.qs.length+' retos · Entrar')+'</small></button>').join('')+'</div><details><summary>Para acompañar a Mar</summary><p>Todos los mundos están disponibles. Cada error incluye una explicación y se repasa al terminar la ronda. Las respuestas acertadas después de una pista también sirven para aprender. El progreso se guarda en este navegador cuando sea posible.</p><p>El botón de voz utiliza la voz española disponible en el dispositivo. Si no hay voz, se puede jugar leyendo.</p></details>'}function start(i){li=i;queue=shuffle(levels[i].qs.map((_,n)=>n));pos=0;miss=[];first=0;render()}function speak(){if(!window.speechSynthesis){return}speechSynthesis.cancel();const q=levels[li].qs[queue[pos]],u=new SpeechSynthesisUtterance(q.q);u.lang='es-ES';u.rate=.9;speechSynthesis.speak(u)}function render(){answered=false;const l=levels[li],q=l.qs[queue[pos]];app.innerHTML='<div class="card"><small>'+l.icon+' '+l.title+' · '+(pos+1)+' / '+queue.length+'</small><div class="bar"><div style="width:'+pos/queue.length*100+'%"></div></div><details><summary>💡 Recordatorio</summary><p>'+l.tip+'</p></details><button onclick="speak()">🔊 Escuchar enunciado</button><p class="question">'+q.q+'</p><div class="options">'+shuffle(q.options.map((t,i)=>({t,i}))).map(o=>'<button data-choice="'+o.i+'" onclick="answer('+o.i+',this)">'+o.t+'</button>').join('')+'</div><div class="feedback" role="status" aria-live="polite" id="feedback"></div><button class="primary" id="next" hidden onclick="next()">Continuar →</button></div>'}function answer(i,b){if(answered)return;answered=true;const q=levels[li].qs[queue[pos]],ok=i===q.answer;document.querySelectorAll('[data-choice]').forEach(x=>{x.disabled=true;if(Number(x.dataset.choice)===q.answer)x.classList.add('good')});if(ok)first++;else{b.classList.add('bad');miss.push(queue[pos])}document.getElementById('feedback').textContent=(ok?'✨ ¡Bien pensado! ':'🌱 Vamos a aprenderlo: ')+q.why;document.getElementById('next').hidden=false}function next(){if(window.speechSynthesis)speechSynthesis.cancel();pos++;if(pos<queue.length){render();return}if(miss.length){queue=shuffle([...new Set(miss)]);miss=[];pos=0;app.innerHTML='<div class="card"><div class="icon">🐈</div><h2>¡Ya estás más cerca!</h2><p>Vamos a practicar de nuevo '+queue.length+' reto'+(queue.length===1?'':'s')+' con lo que acabas de aprender.</p><button class="primary" onclick="render()">Repasar y conseguir la llave</button></div>';return}progress[li]=true;save();app.innerHTML='<div class="card"><div class="icon">🎉 🗝️ '+levels[li].icon+'</div><h1>¡Llave conseguida, Mar!</h1><p>Has completado '+levels[li].title.toLowerCase()+'.</p><p>'+ (Object.keys(progress).length===7?'📚 ¡Has abierto la biblioteca secreta! Eres una exploradora de las palabras.':'La gata mágica te espera en el siguiente mundo.')+'</p><button class="primary" onclick="home()">Volver al mapa</button> <button onclick="start(li)">Jugar otra vez</button></div>'}home();
</script></html>
