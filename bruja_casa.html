<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#30214e"><title>La casa encantada de la bruja · Mar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#6b4b9d,#211733 76%);color:#322248;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}main{max-width:790px;margin:auto;padding:16px 13px 55px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff2d9;font-size:.84rem;font-weight:800}header a,.foot a{color:#fff4df}article{background:#fff9ed;border-radius:28px;box-shadow:0 12px 0 #110d2177;margin:20px 0;padding:clamp(18px,5vw,34px);text-align:center;min-height:460px}h1{font:700 clamp(2rem,7vw,3.4rem) Georgia,serif;margin:8px 0}h2{font:700 clamp(1.4rem,5vw,2rem) Georgia,serif;margin:12px 0}p{line-height:1.45}.hero{font-size:4.4rem}.scene{background:linear-gradient(135deg,#eeddfb,#d9effc);border-radius:22px;padding:18px 12px;margin:16px auto;max-width:510px;min-height:130px;display:grid;place-items:center}.scene .art{font-size:clamp(3rem,10vw,4.7rem);line-height:1.2}.scene .info{font-size:1.08rem;color:#47335f;font-weight:700;margin-top:8px}.chip{display:inline-block;background:#eddcf9;border-radius:25px;padding:7px 13px;font-size:.85rem;font-weight:800;color:#533477}progress{display:block;width:100%;margin:14px 0;height:12px;accent-color:#7f4bbb}button{font:inherit;background:#6840a7;color:white;border:0;padding:13px 17px;min-height:48px;border-radius:14px;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.07)}button:focus-visible,input:focus-visible{outline:3px solid #db9211;outline-offset:3px}button.secondary{background:#e8d8f8;color:#402367}button:disabled{opacity:.5;cursor:not-allowed}.tools,.wordbank,.answerline,.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:12px 0}.wordbank button{background:white;border:2px solid #9765b8;color:#42305c;box-shadow:0 3px 0 #d9c5e6}.wordbank button:disabled{opacity:.34}.answerline{min-height:70px;border:2px dashed #b69dca;border-radius:15px;padding:11px;background:#f7edff}.answerline button{background:#6840a7;padding:10px 12px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:17px 0}.options button{min-height:66px}.prompt{font-size:1.16rem;font-weight:700}.feedback{min-height:2.1em;font-weight:750;color:#573084}.hint{font-size:1.5rem;letter-spacing:.07em;overflow-wrap:anywhere;font-weight:800}.input{width:min(100%,370px);padding:12px;font:inherit;font-size:1.15rem;text-align:center;border:2px solid #8865ad;border-radius:12px;background:white;color:#322248}.note{font-size:.91rem;color:#625576}.foot{text-align:center;color:#f7ecd9;font-size:.85rem}.foot a{margin:0 8px}ul{max-width:500px;margin:18px auto;text-align:left;line-height:1.65}details{text-align:left;margin:23px 0}summary{cursor:pointer;font-weight:700}.mini{font-size:.86rem}.rule{background:#fff1cc;border-radius:12px;padding:10px;margin:10px 0;color:#5a4621}.vocab{line-height:1.8;font-size:.87rem} .status{font-weight:700;color:#fff3d8} @media(max-width:550px){.options{grid-template-columns:1fr}article{min-height:400px}.scene{min-height:110px}.wordbank button{padding:10px 12px}}
</style></head><body><main><header><span>✦ INGLÉS DE MAR · AVENTURA 2</span><a href="index.html">🏡 Mis juegos</a></header><article id="card"><div class="hero">🧙‍♀️🏰</div><h1>La casa encantada de la bruja</h1><p>¡Preparando los hechizos!</p></article><div class="foot"><a href="ingles.html">Primera aventura</a><a href="index.html">Colección de Mar</a><p>Sin cronómetro · Con audio y pistas · Equivocarse también es aprender</p></div></main>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'');
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b};
// Contenido íntegro del videojuego original (49 entradas), más 8 partes de la casa.
const sets=[
 ['Colegio','school|park|playground|toilet|computer room|classroom|corridor|library|gym|dining room','🏫|🌳|🛝|🚽|🖥️|🪑|🚪|📚|🏀|🍽️','colegio|parque|patio de recreo|aseo|aula de informática|clase|pasillo|biblioteca|gimnasio|comedor'],
 ['Colores','red|pink|green|blue|orange|brown|yellow|purple','🔴|🩷|🟢|🔵|🟠|🟤|🟡|🟣','rojo|rosa|verde|azul|naranja|marrón|amarillo|morado'],
 ['Números','one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty','1️⃣|2️⃣|3️⃣|4️⃣|5️⃣|6️⃣|7️⃣|8️⃣|9️⃣|🔟','uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|dieciséis|diecisiete|dieciocho|diecinueve|veinte'],
 ['Posiciones','on|behind|above|under|in front of|between|among|in|next to|near|far','⬆️|👀|⬆️|⬇️|➡️|↔️|👥|📦|↔️|📍|🔭','encima, tocando|detrás|por encima, sin tocar|debajo|delante|entre dos|entre varios|dentro|al lado|cerca|lejos']
];
const old=sets.flatMap(([cat,ws,ps,ss])=>ws.split('|').map((word,i)=>({word,cat,pic:ps.split('|')[i]||'✨',es:ss.split('|')[i]||'número '+(i+1)})));
const rooms=[['living room','salón','🛋️'],['kitchen','cocina','🍳'],['hall','recibidor','🚪'],['bathroom','baño','🛁'],['bedroom','dormitorio','🛏️'],['garage','garaje','🚗'],['attic','desván','🕸️'],['garden','jardín','🌷']].map(([word,es,pic])=>({word,es,pic,cat:'La casa'}));
// Los escenarios expresan hechos visibles, no recuentos arbitrarios de habitaciones.
const scenes=[
 {id:'a',place:'living room',loc:'en el salón',pic:'🛋️ 📚 📚',object:'book',plural:'books',es:'libros',count:2},
 {id:'b',place:'bedroom',loc:'en el dormitorio',pic:'🛏️ 📕',object:'book',plural:'books',es:'libro',count:1},
 {id:'c',place:'garden',loc:'en el jardín',pic:'🌳 🍎 🍎 🍎',object:'apple',plural:'apples',es:'manzanas',count:3},
 {id:'d',place:'kitchen',loc:'en la cocina',pic:'🍳 🍎',object:'apple',plural:'apples',es:'manzana',count:1},
 {id:'e',place:'garage',loc:'en el garaje',pic:'🚗 ⛔ 🐈',object:'cat',plural:'cats',es:'gatos',count:0},
 {id:'f',place:'attic',loc:'en el desván',pic:'🕸️ ⛔ 📗',object:'book',plural:'books',es:'libros',count:0,askSingular:true},
 {id:'g',place:'bathroom',loc:'en el baño',pic:'🛁 🐈',object:'cat',plural:'cats',es:'gato',count:1},
 {id:'h',place:'hall',loc:'en el recibidor',pic:'🚪 🐈 🐈',object:'cat',plural:'cats',es:'gatos',count:2},
 {id:'i',place:'garden',loc:'en el jardín',pic:'🌷 🔴 🌸',object:'flower',plural:'flowers',es:'flor',count:1},
 {id:'j',place:'living room',loc:'en el salón',pic:'🛋️ ⛔ 🍎',object:'apple',plural:'apples',es:'manzanas',count:0}
];
const patterns=[
 {id:'pos1',pic:'🛋️ 📚 📚',es:'Hay dos libros en el salón.',words:['There','are','two','books','in','the','living room.'],audio:'There are two books in the living room.'},
 {id:'pos2',pic:'🛏️ 📕',es:'Hay un libro en el dormitorio.',words:['There','is','one','book','in','the','bedroom.'],audio:'There is one book in the bedroom.'},
 {id:'neg1',pic:'🚗 🚫 🐈',es:'No hay gatos en el garaje.',words:['There',"aren't",'any','cats','in','the','garage.'],audio:"There aren't any cats in the garage."},
 {id:'neg2',pic:'🕸️ 🚫 📚',es:'No hay ningún libro en el desván.',words:['There',"isn't",'a','book','in','the','attic.'],audio:"There isn't a book in the attic."},
 {id:'pos3',pic:'🍳 🍎',es:'Hay una manzana en la cocina.',words:['There','is','an','apple','in','the','kitchen.'],audio:'There is an apple in the kitchen.'},
 {id:'pos4',pic:'🌳 🍎 🍎 🍎',es:'Hay tres manzanas en el jardín.',words:['There','are','three','apples','in','the','garden.'],audio:'There are three apples in the garden.'},
 {id:'question1',pic:'🛏️ 📕',es:'¿Hay un libro en el dormitorio?',words:['Is','there','a','book','in','the','bedroom?'],audio:'Is there a book in the bedroom?'},
 {id:'question2',pic:'🌳 🍎 🍎 🍎',es:'¿Hay manzanas en el jardín?',words:['Are','there','any','apples','in','the','garden?'],audio:'Are there any apples in the garden?'},
 {id:'question3',pic:'🚗 🚫 🐈',es:'¿Hay gatos en el garaje?',words:['Are','there','any','cats','in','the','garage?'],audio:'Are there any cats in the garage?'},
 {id:'position1',pic:'🐈 ⬇️ 🛏️',es:'Hay un gato debajo de la cama.',words:['There','is','a','cat','under','the','bed.'],audio:'There is a cat under the bed.'},
 {id:'position2',pic:'📕 ⬆️ 🛋️',es:'Hay un libro encima del sofá.',words:['There','is','a','book','on','the','sofa.'],audio:'There is a book on the sofa.'},
 {id:'color1',pic:'🔴 🍎 🍎',es:'Hay dos manzanas rojas en la cocina.',words:['There','are','two','red','apples','in','the','kitchen.'],audio:'There are two red apples in the kitchen.'},
 {id:'color2',pic:'🟢 📗',es:'Hay un libro verde en el dormitorio.',words:['There','is','a','green','book','in','the','bedroom.'],audio:'There is a green book in the bedroom.'}
];
let memory={};try{memory=JSON.parse(localStorage.getItem('mar-bruja-casa-v2')||'{}')||{}}catch{};
const stat=id=>memory[id]||{seen:0,level:0,errors:0};
const pick=(a,n)=>shuffle(a).sort((x,y)=>stat(x.id).seen-stat(y.id).seen).slice(0,n);
let round=[],index=0,wrong=false,assisted=false,clean=0,selected=[];
const save=()=>{try{localStorage.setItem('mar-bruja-casa-v2',JSON.stringify(memory))}catch{}};
function say(text){if(!('speechSynthesis' in window)){message('El dispositivo no dispone de lectura en voz alta.');return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.78;u.pitch=1.03;speechSynthesis.speak(u)}catch{message('No se ha podido reproducir el audio.')}}
function message(txt){const el=$('feedback');if(el)el.textContent=txt;}
function toolbar(audio,hint){return `<div class="tools"><button type="button" id="audio" class="secondary">🔊 Escuchar</button><button type="button" id="clue" class="secondary">💡 Pista</button></div>`}
function bindTools(audio,hint){$('audio').onclick=()=>say(audio);$('clue').onclick=()=>{assisted=true;message('💡 '+hint);}}
function top(t){return `<span class="chip">${esc(t)} · ${index+1} de ${round.length}</span><progress max="${round.length}" value="${index}" aria-label="Progreso"></progress>`}
function scene(pic,info){return `<div class="scene"><div><div class="art">${pic}</div><div class="info">${esc(info)}</div></div></div>`}
function finish(answer){const t=round[index],s=stat(t.id);memory[t.id]={seen:s.seen+1,level:assisted||wrong?0:Math.min(2,s.level+1),errors:s.errors+(wrong?1:0)};save();if(!assisted&&!wrong)clean++;message('✅ ¡Correcto! '+answer+' · Pasando al siguiente reto…');const controls=$('controls');controls.innerHTML=`<button type="button" id="next">${index===round.length-1?'Ver mi resultado ahora ➜':'Siguiente reto ahora ➜'}</button>`;let advanced=false;const advance=()=>{if(advanced)return;advanced=true;index++;draw()};$('next').onclick=advance;setTimeout(advance,1250);}
function wordTask(t){const level=stat(t.id).level,letters=[...t.word],eligible=letters.map((c,i)=>/[a-z]/.test(c)?i:-1).filter(i=>i>=0),holes=shuffle(eligible).slice(0,level===0?Math.min(2,eligible.length):Math.min(3,eligible.length)).sort((a,b)=>a-b),mask=letters.map((c,i)=>holes.includes(i)?'_':c).join(''),expected=holes.map(i=>letters[i]).join('');$('card').innerHTML=top(t.group)+scene(t.rec.pic,t.rec.es)+`<h2>${level===2?'Escribe la palabra completa':'¡La bruja ha borrado letras!'}</h2><p>${level===2?'Escribe la respuesta en inglés.':'Escribe SOLO las letras que faltan, de izquierda a derecha.'}</p><div class="hint" lang="en">${level===2?'❔':esc(mask)}</div>${toolbar()}<form id="controls"><input id="entry" class="input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Respuesta en inglés" required><div class="actions"><button type="submit" id="checkword">Comprobar ✨</button></div></form><p id="feedback" class="feedback" role="status"></p>`;bindTools(t.word,t.word);$('controls').onsubmit=e=>{e.preventDefault();const val=norm($('entry').value);if(!val){message('Escribe las letras que faltan antes de comprobar. ✏️');return}if(val!==norm(level===2?t.word:expected)&&val!==norm(t.word)){wrong=true;message('Todavía no es correcto. Revisa las letras o pulsa «Pista». 💜');return}finish(t.word)}}
function orderTask(t){let words=t.pattern.words,used=[];const showLine=()=>{$('line').innerHTML=used.map((j,i)=>`<button type="button" data-return="${i}" title="Quitar palabra">${esc(words[j])} ↩</button>`).join('')||'<span class="note">Toca las palabras para construir la frase aquí.</span>';document.querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>{used.splice(+b.dataset.return,1);showLine();showBank()})};const showBank=()=>{$('bank').innerHTML=shuffle(words.map((w,i)=>({w,i})).filter(o=>!used.includes(o.i))).map(o=>`<button type="button" data-pick="${o.i}">${esc(o.w)}</button>`).join('');document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{used.push(+b.dataset.pick);showLine();showBank()})};$('card').innerHTML=top('ORDENA EL HECHIZO')+scene(t.pattern.pic,t.pattern.es)+`<h2>Ordena las palabras</h2><p>Construye la frase en inglés tocando las palabras. Puedes quitarlas tocándolas arriba.</p>${toolbar()}<div class="answerline" id="line" aria-label="Frase construida"></div><div class="wordbank" id="bank"></div><div id="controls" class="actions"><button id="check">Comprobar ✨</button><button class="secondary" id="clear">Borrar frase</button></div><p id="feedback" class="feedback" role="status"></p>`;showLine();showBank();bindTools(t.pattern.audio,t.pattern.audio);$('check').onclick=()=>{if(used.length!==words.length){message('Aún faltan '+(words.length-used.length)+' palabras. Toca las tarjetas de abajo. 🧩');return}if(norm(used.map(j=>words[j]).join(' '))!==norm(t.pattern.audio)){wrong=true;message('El orden todavía no es correcto. Prueba otra vez. 💜');return}finish(t.pattern.audio)};$('clear').onclick=()=>{used=[];showLine();showBank();message('¡Puedes empezar de nuevo!')}}
const singular=s=>s.count===1||s.askSingular;const query=s=>`${singular(s)?'Is there a':'Are there any'} ${singular(s)?s.object:s.plural} in the ${s.place}?`;
const answer=s=>s.count===0?(singular(s)?"No, there isn't.":"No, there aren't."):singular(s)?'Yes, there is.':'Yes, there are.';
function questionTask(t){const s=t.s,opts=shuffle(['Yes, there is.',"No, there isn't.",'Yes, there are.',"No, there aren't."]),correct=answer(s);$('card').innerHTML=top('RESPONDE A LA BRUJA')+scene(s.pic,`${s.loc}: ${s.count} ${s.es}`)+`<h2>¿Qué contestamos?</h2><p class="prompt" lang="en">${esc(query(s))}</p>${toolbar()}<div id="controls" class="options">${opts.map((o,i)=>`<button type="button" data-opt="${i}">${esc(o)}</button>`).join('')}</div><p id="feedback" class="feedback" role="status"></p><p class="note">Pista: singular → is / isn't; plural → are / aren't.</p>`;bindTools(query(s),correct);document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(norm(opts[+b.dataset.opt])!==norm(correct)){wrong=true;message('Revisa cuántos objetos hay y prueba otra vez. 💜');return}finish(correct)})}
function selectTask(t){const s=t.s,correct=(s.count===0?`There aren't any ${s.plural}`:s.count===1?`There is one ${s.object}`:`There are ${s.count===2?'two':'three'} ${s.plural}`)+` in the ${s.place}.`,opts=shuffle([correct,`There is two ${s.plural} in the ${s.place}.`,`There are one ${s.object} in the ${s.place}.`,`There isn't any ${s.plural} in the ${s.place}.`]);$('card').innerHTML=top('ELIGE LA FRASE')+scene(s.pic,`${s.loc}: ${s.count} ${s.es}`)+`<h2>¿Qué frase es verdadera y está bien escrita?</h2>${toolbar()}<div id="controls" class="options">${opts.map((o,i)=>`<button type="button" data-opt="${i}">${esc(o)}</button>`).join('')}</div><p id="feedback" class="feedback" role="status"></p>`;bindTools(correct,correct);document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(norm(opts[+b.dataset.opt])!==norm(correct)){wrong=true;message('Piensa: ¿hay uno, varios o ninguno? 💜');return}finish(correct)})}
function start(){const allNew=rooms.map(rec=>({id:'room-'+rec.word,type:'word',group:'NUEVO · LA CASA',rec,word:rec.word})),allOld=old.map(rec=>({id:'old-'+rec.word,type:'word',group:'REPASO · '+rec.cat.toUpperCase(),rec,word:rec.word})),allOrder=patterns.map(pattern=>({id:'order-'+pattern.id,type:'order',pattern})),allQ=scenes.map(s=>({id:'qa-'+s.id,type:'qa',s})),allC=scenes.map(s=>({id:'choose-'+s.id,type:'choose',s}));round=shuffle([...pick(allNew,5),...pick(allOld,3),...pick(allOrder,5),...pick(allQ,3),...pick(allC,2)]);index=0;clean=0;draw()}
function draw(){if(index===round.length){$('card').innerHTML=`<div class="hero">🧹🏰✨</div><h1>¡Hechizo conseguido!</h1><p>La bruja ha recuperado las palabras de su casa y de su colegio.</p><h2>${clean} de ${round.length} retos a la primera y sin pistas</h2><p>¡Fantástico, Mar! Otra partida te traerá palabras y frases diferentes.</p><button id="again">Jugar otra vez 🪄</button><p class="note">Progreso recordado en este navegador: ${Object.keys(memory).filter(k=>memory[k].seen).length} actividades distintas.</p>`;$('again').onclick=start;return}wrong=false;assisted=false;const t=round[index];if(t.type==='word')wordTask(t);else if(t.type==='order')orderTask(t);else if(t.type==='qa')questionTask(t);else if(t.type==='choose')selectTask(t)}
function home(){$('card').innerHTML=`<div class="hero">🧙‍♀️🏡✨</div><h1>La casa encantada de la bruja</h1><p>¡La bruja ha desordenado todos los hechizos de su casa! Ayuda a Mar a recuperar las palabras y construir frases.</p><ul><li>🏡 <b>Nuevas habitaciones:</b> las 8 partes de la casa.</li><li>🪄 <b>Nuevas frases:</b> There is / isn't · There are / aren't · Is there...? · Are there...?</li><li>🧩 <b>Construye oraciones:</b> ordena palabras tocándolas.</li><li>🎒 <b>Repasa:</b> las 49 palabras anteriores de colegio, colores, números y posiciones.</li><li>🔊 <b>Escucha:</b> toca «Escuchar» para oír el inglés.</li></ul><button id="begin">¡Empezar la aventura! 🔑</button><p class="note">18 retos por partida · Sin límite de tiempo · Avanza de forma gradual</p><details><summary>📖 Ver todo el vocabulario que puede salir</summary><p><b>Casa:</b> ${rooms.map(r=>esc(r.word)).join(', ')}</p>${sets.map(([cat,words])=>`<p class="vocab"><b>${cat}:</b> ${esc(words.split('|').join(', '))}</p>`).join('')}</details><div class="rule mini">El audio utiliza la voz de inglés del dispositivo. Puede sonar diferente según el navegador.</div>`;$('begin').onclick=start;}
try{home()}catch(e){$('card').textContent='No se ha podido abrir el juego. Prueba a recargar la página.';console.error(e)}
})();
</script></body></html>
